name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./test.sh
      - run: HATH_CLIENT_ID=example HATH_CLIENT_KEY=example docker compose -f portainer-git.compose.yml config --quiet
      - run: docker build -t hath-metric:verify .
